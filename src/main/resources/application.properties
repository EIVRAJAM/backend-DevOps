spring.application.name=backend

server.port=3020

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.mvc.servlet.path=/api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.profiles.active=local

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# PASSWORD RESET CONFIGURATION
# ==========================================
password-reset.code-expiration-minutes=10
password-reset.max-attempts=5

# ==========================================
# ACCOUNT UNLOCK CONFIGURATION
# ==========================================
account-unlock.code-expiration-minutes=10
account-unlock.max-attempts=5

# ==========================================
# APP CONFIGURATION
# ==========================================
app.name=DevOps Backend

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.expiration-minutes=30

# ==========================================
# OAUTH2 GOOGLE CONFIGURATION
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:dev-secret}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:3020/api/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ==========================================
# OAUTH2 FRONTEND CONFIGURATION
# ==========================================
oauth2.frontend-url=${OAUTH2_FRONTEND_URL:http://localhost:5173}

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true